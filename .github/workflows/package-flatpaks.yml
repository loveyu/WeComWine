name: Package Flatpaks

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      BUILD_JOBS: "4"
      WECOM_REQUIRE_RICHEDIT_PACKAGE: "0"
      WECOM_RICHEDIT_DLL: ""

    steps:
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak curl patch make gcc git xz-utils

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build runner and Flatpak bundles
        run: ./scripts/ci-package-flatpaks.sh

      - name: Show package diagnostics
        if: failure()
        run: |
          status_file="$HOME/.local/state/wecom-flatpak-poc/portal-build.status"
          log_file="$HOME/.local/state/wecom-flatpak-poc/logs/portal-build.log"
          if [[ -f "$status_file" ]]; then
            echo '== portal-build.status =='
            cat "$status_file"
          fi
          if [[ -f "$log_file" ]]; then
            echo '== portal-build.log (last 500 lines) =='
            tail -n 500 "$log_file"
          fi

      - name: Upload Flatpak bundles
        uses: actions/upload-artifact@v7
        with:
          name: wecomwine-public-${{ github.run_id }}
          path: artifacts/flatpak/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
