# 依赖和补丁来源记录。此文件不直接用于当前产物构建：企业微信需要传统
# WoW64 的 64/32 位配对编译以及以 org.winehq.Wine 为 base 的扩展元数据。
# 已在目标机验证的权威重建入口是 ../scripts/build-portal-wine.sh。
id: io.github.huzhiyu.WeComWine
default-branch: stable-25.08
sdk: org.freedesktop.Sdk
runtime: org.freedesktop.Platform
runtime-version: '25.08'
command: wine
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --allow=multiarch
  - --filesystem=xdg-download/WeCom:create
  - --env=WINEPREFIX=/var/data/wine-wecom
sdk-extensions:
  - org.freedesktop.Sdk.Compat.i386
  - org.freedesktop.Sdk.Extension.toolchain-i386
  - org.freedesktop.Sdk.Extension.mingw-w64
modules:
  - name: wine-portal
    config-opts:
      - --disable-winemenubuilder
      - --disable-tests
    sources:
      - type: archive
        url: https://dl.winehq.org/wine/source/11.0/wine-11.0.tar.xz
        sha256: c07a6857933c1fc60dff5448d79f39c92481c1e9db5aa628db9d0358446e0701
      - type: patch
        path: ../patches/wine-portal/0001-comdlg32-add-XDG-desktop-portal-backend-for-file-dia.patch
      - type: patch
        path: ../patches/wine-portal/0002-comdlg32-route-IFileDialog-through-portal-when-compa.patch
      - type: patch
        path: ../patches/wine-portal/0003-winecfg-add-portal-file-dialog-policy-and-UI.patch
      - type: patch
        path: ../patches/wine-portal/0004-comdlg32-tests-add-IFileOpenDialog-FOS_PICKFOLDERS-r.patch
      - type: patch
        path: ../patches/wine-portal/0005-shell32-route-SHBrowseForFolderW-through-portal-when.patch
      - type: patch
        path: ../patches/wine-portal/0006-comdlg32-avoid-MAX_PATH-truncation-for-portal-items.patch
